name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:ci

      - name: Validate geospatial contracts
        run: bun run geospatial:validate

      - name: Validate road surfaces
        run: bun run road:test

      - name: Validate road junctions
        run: bun run road:junction-test

      - name: Validate walkable player spawn
        run: bun run player:spawn-test

      - name: Validate terrain structure masks
        run: bun run terrain:mask-test

      - name: Build
        run: bun run build
