name: Geospatial Refresh Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feat/terrain-road-walkability' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh official CONDER terrain
        run: |
          bun run geospatial:import:conder
          bun run geospatial:derive:terrain
          bun run geospatial:build
          bun run geospatial:validate

      - name: Commit generated CONDER terrain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             geospatial/raw/conder/contours.arcgis.json             geospatial/normalized/conder/contours.json             geospatial/derived/terrain.json             src/data/geospatial-base.json
          if git diff --cached --quiet; then
            echo "No generated terrain changes to commit."
            exit 0
          fi
          git commit -m "Materialize official CONDER terrain"
          git push origin HEAD:${{ github.head_ref }}
